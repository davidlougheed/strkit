name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de  # v1.17.0+4
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Install local strkit_rust_ext
        run: pushd .. && git clone https://github.com/davidlougheed/strkit_rust_ext.git && popd

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest -svv --cov=strkit --cov-branch

  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@0267444136ce4919088f5eae0461f736f21356de  # v1.17.0+4
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Install local strkit_rust_ext
        run: pushd .. && git clone https://github.com/davidlougheed/strkit_rust_ext.git && popd

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build
        run: uv build

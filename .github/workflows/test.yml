name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@8439c15d249cd2e2a5c80ad3da200c3d8c553ae4  # v1.17.0+2
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Install local strkit_rust_ext
        run: pushd .. && git clone https://github.com/davidlougheed/strkit_rust_ext.git && popd

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest -svv --cov=strkit --cov-branch

  test-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        name: Set up Python
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions-rust-lang/setup-rust-toolchain@8439c15d249cd2e2a5c80ad3da200c3d8c553ae4  # v1.17.0+2
        with:
          toolchain: 1.88.0
          rustflags: ""

      - name: Install local strkit_rust_ext
        run: pushd .. && git clone https://github.com/davidlougheed/strkit_rust_ext.git && popd

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Build
        run: uv build
